name: Upshift Nightly Builds

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  packages: write

jobs:
  build-fabric:
    name: Fabric Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        working-directory: ./fabric
        run: ./gradlew --no-daemon build

      - name: Upload Fabric Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upshift-fabric-${{ github.run_number }}
          path: fabric/build/libs/*.jar
          retention-days: 14

  build-neoforge:
    name: NeoForge Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge
        working-directory: ./neoforge
        run: ./gradlew --no-daemon build

      - name: Upload NeoForge Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upshift-neoforge-${{ github.run_number }}
          path: neoforge/build/libs/*.jar
          retention-days: 14

  build-vr-fabric:
    name: Fabric VR Edition Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric VR Edition
        working-directory: ./fabric/upshift-vr-edition
        run: ./gradlew --no-daemon build

      - name: Upload VR Fabric Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upshift-vr-fabric-${{ github.run_number }}
          path: fabric/upshift-vr-edition/build/libs/*.jar
          retention-days: 14

  build-vr-neoforge:
    name: NeoForge VR Edition Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge VR Edition
        working-directory: ./neoforge/upshift-vr-edition
        run: ./gradlew --no-daemon build

      - name: Upload VR NeoForge Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upshift-vr-neoforge-${{ github.run_number }}
          path: neoforge/upshift-vr-edition/build/libs/*.jar
          retention-days: 14