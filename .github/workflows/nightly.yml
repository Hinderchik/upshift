name: Upshift Builds

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: upshift-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabric:
    name: Fabric (base + VR Edition)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: chmod +x fabric/gradlew fabric/upshift-vr-edition/gradlew

      - name: Build Fabric base
        working-directory: ./fabric
        run: ./gradlew --no-daemon build

      - name: Build Fabric VR Edition
        working-directory: ./fabric/upshift-vr-edition
        run: ./gradlew --no-daemon build

      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upshift-fabric-${{ github.run_number }}
          path: |
            fabric/build/libs/*.jar
            fabric/upshift-vr-edition/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  neoforge:
    name: NeoForge (base + VR Edition)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: chmod +x neoforge/gradlew neoforge/upshift-vr-edition/gradlew

      - name: Build NeoForge base
        working-directory: ./neoforge
        run: ./gradlew --no-daemon build

      - name: Build NeoForge VR Edition
        working-directory: ./neoforge/upshift-vr-edition
        run: ./gradlew --no-daemon build

      - name: Upload NeoForge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upshift-neoforge-${{ github.run_number }}
          path: |
            neoforge/build/libs/*.jar
            neoforge/upshift-vr-edition/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
