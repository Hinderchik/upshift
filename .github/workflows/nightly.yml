name: Upshift Builds

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: upshift-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric
            dir: fabric
            artifact: upshift-fabric
          - name: NeoForge
            dir: neoforge
            artifact: upshift-neoforge
          - name: Fabric VR Edition
            dir: fabric/upshift-vr-edition
            artifact: upshift-vr-fabric
          - name: NeoForge VR Edition
            dir: neoforge/upshift-vr-edition
            artifact: upshift-vr-neoforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: ./${{ matrix.dir }}
        run: chmod +x gradlew

      - name: Build ${{ matrix.name }}
        working-directory: ./${{ matrix.dir }}
        run: ./gradlew --no-daemon build

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
