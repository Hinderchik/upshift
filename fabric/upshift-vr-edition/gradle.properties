# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric / Loom
loom_version=1.17.21
fabric_loader_version=0.19.5
minecraft_version=26.2
fabric_api_version=0.161.0+26.2

# Mod metadata
mod_id=upshift_vr
mod_name=Upshift VR Edition
mod_version=1.1.0
upshift_version=1.7.0
mod_description=Upshift, tuned for headsets. Keeps the history of the temporal upscaler separate for the left and the right eye, scales both lenses from one measurement of the combined stereo work, steadies the temporal clamp where a sub-pixel shimmer would show up as a wobble, and hands the frame generator over to the headset while the built-in interpolator steps aside. Requires Upshift and a Vivecraft build for 26.2.
mod_license=MIT
mod_authors=XunKal1
maven_group=dev.upshift
archives_base_name=upshift_vr_edition

# Java
# Mod bytecode targets 21; Minecraft 26.2 needs Java 25 to run.
java_version=21
