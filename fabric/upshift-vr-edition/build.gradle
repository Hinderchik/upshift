plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = uri("../libs/repo") }
        }
        filter {
            includeModule("net.fabricmc.fabric-api", "fabric-api")
        }
    }
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:1.21.4+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    // Upshift is the mod this addon extends: the client entrypoint activates its
    // core at runtime only when both Upshift and Vivecraft are present.
    modImplementation files("../build/libs/upshift-${upshift_version}.jar")

    // Sodium - compile-only and development runtime; optional at runtime.
    modCompileOnly files("../sodium-fabric-0.9.2+mc26.2.jar")
    modRuntimeOnly files("../sodium-fabric-0.9.2+mc26.2.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xdiags:verbose"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    withSourcesJar()
}

jar {
    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Loom remaps Fabric API's nested modules but drops the "jars" list from the
// remapped fabric.mod.json, so the development loader never discovers them and
// no mod resource pack is registered. Append the already-remapped module jars
// to the development runtime classpath; the loader picks them up from there.
tasks.named("runClient") {
    classpath += files(
        fileTree(".gradle/loom-cache/remapped_mods/remapped/net/fabricmc/fabric-api") {
            include("**/*.jar")
            exclude("**/fabric-api-a64e8edf/**")
        }
    )
}
