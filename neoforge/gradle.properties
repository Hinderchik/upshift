# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge / ModDevGradle
moddev_version=2.0.148
neoforge_version=26.2.0.93
minecraft_version=26.2

# Optional integrations (compile-only)
sodium_version=0.9.2+mc26.2

# Mod metadata
mod_id=upshift
mod_name=Upshift
mod_version=1.8.0
mod_description=Render less, see more. Upshift draws the world at a lower internal resolution and resolves it back with real upscalers - FSR 1, NVIDIA Image Scaling and a built-in temporal accumulate - and presents extra interpolated frames on any GPU, selectable at 2x, 3x or 4x. Both live inside Sodium's video settings, both work on the OpenGL and the Vulkan backend.
mod_license=MIT
mod_authors=XunKal1
maven_group=dev.upshift
archives_base_name=upshift

# Java
# Minecraft 26.2 ships Java 25 bytecode, so the port compiles for Java 25.
java_version=25
