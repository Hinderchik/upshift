# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge / ModDevGradle
moddev_version=2.0.148
neoforge_version=26.2.0.93
minecraft_version=26.2

# Optional integrations (compile-only)
sodium_version=0.9.2+mc26.2

# Mod metadata
mod_id=upshift_vr
mod_name=Upshift VR Edition
mod_version=1.2.0
upshift_version=1.8.0
mod_description=Upshift, tuned for headsets. Keeps the history of the temporal upscaler separate for the left and the right eye, scales both lenses from one measurement of the combined stereo work, steadies the temporal clamp where a sub-pixel shimmer would show up as a wobble, and hands the frame generator over to the headset while the built-in interpolator steps aside. Requires Upshift and a NeoForge Vivecraft build for 26.2.
mod_license=MIT
mod_authors=XunKal1
maven_group=dev.upshift
archives_base_name=upshift_vr_edition

# Java
# Minecraft 26.2 ships Java 25 bytecode, so the port compiles for Java 25.
java_version=25
