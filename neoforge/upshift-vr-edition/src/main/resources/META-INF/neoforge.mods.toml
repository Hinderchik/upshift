modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/XunKal1/upshift/issues"

[[mods]]
modId = "upshift_vr"
version = "${version}"
displayName = "Upshift VR Edition"
authors = "XunKal1"
description = '''
Upshift, tuned for headsets. Keeps the history of the temporal upscaler separate for the left and the right eye, scales both lenses from one measurement of the combined stereo work, steadies the temporal clamp where a sub-pixel shimmer would show up as a wobble, and hands the frame generator over to the headset while the built-in interpolator steps aside. Requires Upshift and a NeoForge Vivecraft build for 26.2.
'''

[[mixins]]
config = "upshift_vr.mixins.json"

[[dependencies.upshift_vr]]
modId = "neoforge"
type = "required"
versionRange = "[26.2.0.93,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.upshift_vr]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,26.3)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.upshift_vr]]
modId = "upshift"
type = "required"
versionRange = "[1.6.4,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.upshift_vr]]
modId = "sodium"
type = "optional"
versionRange = "[0.9.2,)"
ordering = "AFTER"
side = "CLIENT"
